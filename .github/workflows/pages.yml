name: Live demo

# Publishes the frontend to GitHub Pages. Only the static files are deployed:
# the backend, tests and Docker files are not part of the site, so the demo
# runs in checklist-only mode and keeps progress in the visitor's browser.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the static files
        run: |
          mkdir -p _site/js
          cp index.html _site/
          cp -r css data _site/
          cp js/*.js _site/js/
          cp LICENSE _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
