name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: for f in js/*.js; do node --check "$f"; done
      - name: Run frontend unit tests
        run: node --test js/tests/*.test.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Start and check the services
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5000/api/auth/status && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/api/auth/status
          curl -fsS -o /dev/null http://127.0.0.1:8000/
          # The static server must not expose the backend.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/backend/app.py)" = "404"
          printf 'ci-docker-password-1\nci-docker-password-1\n' | docker compose exec -T api python app.py set-password
          curl -fsS http://127.0.0.1:5000/api/auth/status | grep -q '"configured":true'
      - name: Logs
        if: always()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
