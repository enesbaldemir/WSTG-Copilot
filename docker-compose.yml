# Start:            docker compose up -d --build
# Set the password: docker compose exec api python app.py set-password
# Open:             http://localhost:8000
services:
  api:
    build: .
    image: pentest-workspace:local
    restart: unless-stopped
    env_file:
      - path: backend/.env
        required: false
    ports:
      # Published on this computer only. Do not change to 0.0.0.0 unless you
      # have read "Authentication" in the README: the API uses plain HTTP.
      - "127.0.0.1:5000:5000"
    volumes:
      - wstg-data:/data
      - wstg-uploads:/app/backend/uploads
    extra_hosts:
      # Lets the API reach Ollama running on this computer:
      # OLLAMA_BASE_URL=http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/auth/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    # Same image as the API (built once, from the cache), serving only the static frontend.
    build: .
    image: pentest-workspace:local
    restart: unless-stopped
    command: ["python", "-m", "http.server", "8000", "--bind", "0.0.0.0", "--directory", "/srv/web"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      api:
        condition: service_started

volumes:
  wstg-data:
  wstg-uploads:
